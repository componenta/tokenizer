name: Publish v1.0.1

on:
  push:
    branches: ['release/v1.0.1']

permissions:
  contents: read

concurrency:
  group: publish-v1.0.1
  cancel-in-progress: false

jobs:
  test:
    name: PHP ${{ matrix.php }} release gate
    if: github.repository == 'componenta/tokenizer' && github.ref == 'refs/heads/release/v1.0.1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f8d267055ec5ebb33d125da280091b9629fb080e
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: vendor/bin/pest --reverse-order

  publish:
    name: Publish v1.0.1
    needs: test
    if: github.repository == 'componenta/tokenizer' && github.ref == 'refs/heads/release/v1.0.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: f8d267055ec5ebb33d125da280091b9629fb080e
      TAG: v1.0.1
    steps:
      - name: Verify target and create release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to replace it."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Fixes
          - Preserve namespaces and imports across PHP closing tags, comments and contextual keyword names.
          - Discover named declarations in closures, including PHP 8.5 attribute callbacks.
          - Return independent reflection objects and reject mismatched declaration kinds.
          - Keep metadata-only inspection free from autoloading.
          
          ## Verification
          Pest on PHP 8.4 and 8.5, in normal and reverse order. Updated English and Russian documentation.
          
          Behavior corrections: reflection may autoload, and mismatched declaration kinds throw ReflectionException. The reflector property does not guarantee object identity.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'v1.0.1 — Reliable declaration discovery' --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$RELEASE_SHA"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease
